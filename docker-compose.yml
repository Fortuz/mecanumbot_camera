version: "3.9"

services:
  mecanumbot_camera:
    build:
      context: .
      dockerfile: Dockerfile
    image: mecanumbot_camera:humble
    container_name: mecanumbot_camera_ros2
    platform: linux/amd64

    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=1
      - ROS_DOMAIN_ID=19
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    volumes:
      - .:/ws/src/mecanumbot_camera:rw
      - mecanumbot_camera_build:/ws/build
      - mecanumbot_camera_install:/ws/install
      - mecanumbot_camera_log:/ws/log

    working_dir: /ws
    entrypoint: ["/ros_entrypoint.sh"]
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ws/install/setup.bash 2>/dev/null || true &&
               tail -f /dev/null"

    ports:
      - "8765:8765"

volumes:
  mecanumbot_camera_build:
  mecanumbot_camera_install:
  mecanumbot_camera_log:
