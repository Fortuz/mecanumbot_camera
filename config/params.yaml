ball_tracker_rgb:
  ros__parameters:
    image_topic: "/camera/image_raw"
    camera_info_topic: "/camera/camera_info"
    # Tennis ball HSV (tune later to your lighting/ball)
    hsv_lower: [25, 120, 120]
    hsv_upper: [45, 255, 255]
    min_area_px: 150
    det_ball_topic: "/detections/ball"
    debug_image_topic: "/camera/image_debug"
    mask_image_topic: "/camera/image_mask"
    publish_debug_image: false
    publish_mask_image: false

people_detector:
  ros__parameters:
    image_topic: "/camera/image_raw"
    camera_info_topic: "/camera/camera_info"
    ann_topic: /camera/annotations
    debug_image_topic: /camera/people_debug
    publish_debug_image: false
    det_topic: "/detections/person"
    #model_path: "/ws/src/mecanumbot_camera/models/yolov8n.onnx"  # <— inside the container
    #model_path: "/home/pi/mecanum/src/mecanumbot_camera/models/yolov8n.onnx"
    #model_path: "/home/pi/mecanum/src/mecanumbot_camera/models/yolov4-tiny.onnx"
    #model_path: "/home/pi/mecanum/src/mecanumbot_camera/models/ssd_mobilenet_v1_10.onnx"
    #model_path: "/home/pi/mecanum/src/mecanumbot_camera/models/ssd_mobilenet_v1.tflite"
    #model_path: "/home/pi/mecanum/src/mecanumbot_camera/models/mobilenet_ssd_v2_coco_quant_postprocess.tflite"
    #model_path: "/home/pi/mecanum/src/mecanumbot_camera/models/yolov4-tiny-416.tflite"
    model_path: ""
    input_size: [416, 416]
    conf_threshold: 0.65
    iou_threshold: 0.45
    infer_every_n: 4
    person_class_ids: [0]
    use_gpu_if_available: true
    num_threads: 4
    # Optional explicit delegate path (if empty, auto-tries common locations):
    # gpu_delegate_lib: "/usr/lib/aarch64-linux-gnu/libtensorflowlite_gpu_delegate.so"

overlay_fused:
  ros__parameters:
    image_topic: /camera/image_raw
    person_det_topic: /detections/person
    ball_det_topic: /detections/ball
    out_topic: /camera/fused_debug

behavior_manager:
  ros__parameters:
    image_height: 480
    fetch_enter_px: 150
    fetch_stop_px: 240
    search_speed: 0.125
    Kp_rot: 0.0030
    max_ang: 0.9
    slow_ang_scale: 0.85
    slow_lin_scale: 0.45
    ball_close_turn_boost_start_px: 150.0
    ball_close_turn_boost: 1.8
    ball_forward_slowdown_start_px: 60.0
    ball_forward_stop_error_px: 180.0
    grasp_center_tolerance_px: 80.0
    enable_has_object_grasp: true
    has_object_topic: /mecanumbot/has_object
    has_object_timeout: 0.4
    enable_camera_tilt_control: true
    camera_tilt_topic: /cmd_accessory_pos
    # n_pos from Fortuz/mecanumbot accessory channel (approx range: 2.0..8.6)
    camera_tilt_ball_n_pos: 7.2
    camera_tilt_owner_n_pos: 8.2
    camera_tilt_search_sweep_enabled: true
    camera_tilt_search_min_n_pos: 5.8
    camera_tilt_search_max_n_pos: 7.4
    camera_tilt_search_sweep_period: 9.0
    camera_tilt_owner_search_sweep_enabled: true
    camera_tilt_owner_search_min_n_pos: 7.6
    camera_tilt_owner_search_max_n_pos: 8.4
    camera_tilt_owner_search_sweep_period: 7.0
    camera_tilt_publish_min_delta: 0.03
    camera_tilt_track_min_n_pos: 5.6
    camera_tilt_track_max_n_pos: 8.1
    camera_tilt_track_kp: 0.005
    camera_tilt_track_deadband_px: 24.0
    camera_tilt_track_close_down_n_pos: 5.7
    camera_tilt_track_close_start_px: 140.0
    camera_tilt_track_close_full_px: 260.0
    # Accessory msg contains neck+gripper together; passthrough tracks current gripper from OpenCR state.
    camera_tilt_opencr_state_topic: /opencr_state
    camera_tilt_use_opencr_gripper_passthrough: true
    # fallback only if passthrough is unavailable
    camera_tilt_gripper_hold_left: 5.12
    camera_tilt_gripper_hold_right: 5.12
